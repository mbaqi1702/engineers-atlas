var L=s.data(),d=D[L.d]||{n:"",h:215},pre=(L.pre||[]).map(function(p){return LS[p]?'<a class="chip" href="#/l/'+p+'">'+esc(LS[p].t)+"</a>":""}).join(""),
q=(L.q||[]).length?"<h3>Check yourself</h3>"+L.q.map(function(x){return"<details><summary>"+inl(x[0])+"</summary><p>"+inl(x[1])+"</p></details>"}).join(""):"",
rs=(L.res||[]).filter(function(r){return/^https?:/.test(r[1])}),rh=rs.length?"<h3>Go deeper</h3><ul>"+rs.map(function(r){return'<li><a href="'+esc(r[1])+'" target="_blank" rel="noopener">'+esc(r[0])+"</a> — "+esc(r[2])+"</li>"}).join("")+"</ul>":"";
m.innerHTML='<article style="--h:'+d.h+'"><a class="meta" href="#/d/'+L.d+'">'+esc(d.n)+"</a><h1>"+esc(L.t)+'</h1><div class="meta"><span class="lvb">'+LV[L.lv]+"</span> · "+L.m+" min"+(L.v?" · verified "+esc(L.v):"")+"</div>"+(pre?'<div class="meta">Before this: '+pre+"</div>":"")+'<div class="prose" id="pr">'+md(L.md,L.dg)+"</div>"+q+rh+'<p><button id="dn">'+(S.done[id]?"Completed ✓":"Mark complete")+"</button></p></article>";
link($("#pr"));S.last=id;save();$("#dn").onclick=function(){if(S.done[id])delete S.done[id];else S.done[id]=1;save();this.textContent=S.done[id]?"Completed ✓":"Mark complete"}}).catch(function(){m.innerHTML="<p>Could not load this lesson.</p>"})}
function gloss(){var m=$("#main");m.innerHTML='<h1>Glossary</h1><input id="gf" placeholder="Filter terms" style="width:100%;max-width:360px;padding:8px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--fg)"><div id="gl"></div>';
function r(){var v=$("#gf").value.toLowerCase(),ks=Object.keys(TERMS).sort(function(a,b){return TERMS[a].n.localeCompare(TERMS[b].n)}).filter(function(k){return!v||(TERMS[k].n+" "+TERMS[k].d).toLowerCase().indexOf(v)>=0});
$("#gl").innerHTML=ks.length?ks.map(function(k){return'<a class="card" href="#/t/'+k+'"><b>'+esc(TERMS[k].n)+'</b> <span class="meta">'+esc((D[TERMS[k].dm]||{}).n||"")+"</span><br>"+inl(TERMS[k].d)+"</a>"}).join(""):'<p class="meta">No terms yet.</p>'}
$("#gf").oninput=r;r()}
function flash(){var a=Object.keys(TERMS).filter(function(k){return!S.known[k]}),m=$("#main");if(!a.length){m.innerHTML="<h1>Flashcards</h1><p>No terms to review yet.</p>";return}
var id=a[Math.floor(Math.random()*a.length)],t=TERMS[id];m.innerHTML='<h1>Flashcards</h1><div class="fc" id="fc">'+esc(t.n)+"<small>Click to reveal</small></div><div class=\"act\"><button id=\"ag\">Again</button><button id=\"gt\">Got it</button></div><p class=\"meta\">"+a.length+" terms left</p>";
$("#fc").onclick=function(){this.innerHTML=esc(t.n)+"<p>"+inl(t.d)+"</p>"};$("#ag").onclick=flash;$("#gt").onclick=function(){S.known[id]=1;save();flash()}}
function closeDr(){ST=[];location.hash=cur}
function openTerm(id){var t=TERMS[id],d=$("#dr");if(!t){d.hidden=true;return}if(ST[ST.length-1]!==id)ST.push(id);
var rel=(t.r||[]).filter(function(x){return TERMS[x]}).map(function(x){return'<a class="chip" href="#/t/'+x+'">'+esc(TERMS[x].n)+"</a>"}).join(""),ls=(t.l||[]).filter(function(x){return LS[x]}).map(function(x){return'<a class="chip" href="#/l/'+x+'">'+esc(LS[x].t)+"</a>"}).join("");
d.innerHTML='<div class="dh2"><button id="bk">'+(ST.length>1?"← Back":"Close")+'</button><button id="cl" aria-label="Close">×</button></div><h2>'+esc(t.n)+'</h2><div class="meta">'+esc((D[t.dm]||{}).n||"")+"</div><p>"+inl(t.d)+"</p>"+(t.x?md(t.x):"")+(rel?"<h4>Related</h4>"+rel:"")+(ls?"<h4>Learn it</h4>"+ls:"")+'<div class="act"><button id="kn">'+(S.known[id]?"Known ✓":"Mark as known")+"</button>"+(SMP?'<button id="dd">Deep dive with Claude</button>':"")+'</div><div id="ai" class="ai"></div>';
d.hidden=false;$("#cl").onclick=closeDr;$("#bk").onclick=function(){ST.pop();if(ST.length){location.hash="#/t/"+ST.pop()}else closeDr()};
$("#kn").onclick=function(){if(S.known[id])delete S.known[id];else S.known[id]=1;save();this.textContent=S.known[id]?"Known ✓":"Mark as known"};
if(SMP)$("#dd").onclick=function(){var o=$("#ai");o.textContent="Thinking…";SMP('You are a senior engineer and teacher. Explain "'+t.n+'" ('+t.d+") for a developer learning software engineering. Use markdown with sections: Why it exists, How it works, A small example (code), Common mistakes, Where it is used in real products. Be accurate and say when details depend on version. Under 450 words.",{cache:false,onText:function(x){o.innerHTML=md(x.text)+'<p class="meta">AI-generated. Verify against official docs.</p>'}}).catch(function(e){o.textContent="Could not generate: "+(e&&e.message||e)})}}
function view(h){var m;if(m=h.match(/^#\/l\/(.+)/))lesson(m[1]);else if(m=h.match(/^#\/d\/(.+)/))domain(m[1]);else if(h==="#/g")gloss();else if(h==="#/f")flash();else atlas()}
function route(){var h=location.hash||"#/",m;if(m=h.match(/^#\/t\/(.+)/)){if(!$("#main").innerHTML)view(cur);openTerm(decodeURIComponent(m[1]));return}$("#dr").hidden=true;ST=[];cur=h;view(h);window.scrollTo(0,0)}
function rebuild(){clearTimeout(tm);tm=setTimeout(function(){LS={};for(var d in TOC)for(var k in TOC[d])LS[k]={id:k,d:d,t:TOC[d][k][0],lv:TOC[d][k][1],m:TOC[d][k][2]};buildRe();side();var h=location.hash||"#/";if(h==="#/"||/^#\/(d|g)/.test(h))view(h)},250)}
$("#q").oninput=function(e){var v=e.target.value.trim().toLowerCase(),r=$("#sr");if(v.length<2){r.hidden=true;return}var out=[];
Object.keys(LS).forEach(function(k){if(LS[k].t.toLowerCase().indexOf(v)>=0)out.push(["Lesson",LS[k].t,"#/l/"+k])});
Object.keys(TERMS).forEach(function(k){var t=TERMS[k];if((t.n+" "+(t.a||[]).join(" ")).toLowerCase().indexOf(v)>=0)out.push(["Term",t.n,"#/t/"+k])});
r.innerHTML=out.slice(0,10).map(function(x){return'<a href="'+x[2]+'"><small>'+x[0]+"</small> "+esc(x[1])+"</a>"}).join("")||'<span class="meta">No matches yet</span>';r.hidden=false};
document.addEventListener("click",function(e){if(e.target.closest("#sr a"))setTimeout(function(){$("#sr").hidden=true;$("#q").value=""},0);else if(!e.target.closest("#q"))$("#sr").hidden=true});
document.addEventListener("keydown",function(e){if(e.key==="/"&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){e.preventDefault();$("#q").focus()}if(e.key==="Escape"&&!$("#dr").hidden)closeDr()});
window.addEventListener("hashchange",route);
(function(){
var main=$("#main");main.innerHTML='<p class="meta">Loading the Atlas\u2026</p>';
function J(u){return fetch(u).then(function(r){if(!r.ok)throw new Error(u+" returned "+r.status);return r.json()})}
var bundles={};
DB={doc:function(p){var id=p.replace(/^lessons\//,"");return{get:function(){var dom=LS[id]&&LS[id].d;if(!dom)return Promise.resolve({exists:false});
return(bundles[dom]||(bundles[dom]=J("data/lessons/"+dom+".json"))).then(function(b){var d=b[id];return{exists:!!d,data:function(){return d}}})}}}};
Promise.all([J("data/toc.json"),J("data/terms.json"),J("data/home.json").catch(function(){return null})]).then(function(r){
TOC=r[0];TERMS=r[1];HOME=r[2];LS={};for(var d in TOC)for(var k in TOC[d])LS[k]={id:k,d:d,t:TOC[d][k][0],lv:TOC[d][k][1],m:TOC[d][k][2]};
buildRe();side();route()}).catch(function(e){main.innerHTML='<h1>Could not load the Atlas</h1><p>'+esc(e.message)+'. If you opened index.html as a file, serve the folder instead, for example <code>python3 -m http.server</code>.</p>'});
})();
